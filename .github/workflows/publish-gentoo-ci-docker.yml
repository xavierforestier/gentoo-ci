# .github/gentoo-ci

name: Create and publish a Docker image for CI

on:
  workflow_dispatch:
  schedule:
    - cron: "37 17 * * *" 
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: "xavierforestier/gentoo-ci"

jobs:
  build-and-push:
    name: Build docker image, and push in ghcr.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          repository: ${{ env.IMAGE_NAME }}

      - name: Log in to the Container registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Delete old images
        uses: snok/container-retention-policy@v2
        with:
          image-names: '*'
          cut-off: 1 month ago UTC
          keep-at-least: 3
          timestamp-to-use: created_at
          account-type: personal
          token: ${{ secrets.GH_PAT }}
          
  readme:
    uses: xavierforestier/gentoo-ci/.github/workflows/update-readme.yml@master
    needs: build-and-push
    secrets: inherit
    name: Update README.md
